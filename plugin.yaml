name: herald-push
label: Kyllene push
version: 0.7.1
manifest_version: 2
requires_hermes: ">=0.21.5"
description: >
  End-to-end encrypted notifications for the Kyllene Android app, through ntfy, so a phone hears from its
  bots even when it can't reach the gateway (off the tailnet, on mobile data). Every message is encrypted
  to the phone's key and signed by the gateway; the ntfy server only carries opaque envelopes. Phones
  register themselves from Kyllene over the authenticated dashboard connection. Also the phone tools: the
  agent can read the phone's battery, place or calendar, set an alarm and more, only the tools the user
  switched on in Kyllene, and every change asks on the phone first. With Calls on in Kyllene, the agent can
  ring the user's own phone and watch for something urgent, and talk it over by voice. And, as an
  experiment, it can draw a small screen in the chat (A2UI), change it in place later, and wait for the
  user's tap.
author: Giton22
homepage: https://github.com/Giton22/hermes-herald-push
license: MIT
provides_tools:
  - phone_battery
  - phone_network
  - phone_sound
  - phone_alarm
  - phone_screen_time
  - phone_open
  - phone_clipboard
  - phone_location
  - phone_geofence
  - phone_calendar
  - phone_contacts
  - phone_health
  - phone_call_me
  - phone_show_ui
config_schema:
  enabled:
    type: bool
    default: true
    label: Send notifications
    description: Push this bot's new messages to the registered phones. Each bot (profile) has its own switch.
